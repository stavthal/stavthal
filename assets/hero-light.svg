  <text x="44" y="182" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#475569">building reliable fintech &amp; SaaS systems — production APIs,</text>
