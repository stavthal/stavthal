name: render profile cards

on:
  schedule:
    - cron: '17 4 * * *'   # daily, so the numbers on the profile never go stale
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/render.yml']

permissions:
  contents: write

concurrency:
  group: render-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render every card in both themes
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/render.mjs

      - name: Commit when the numbers moved
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets
          git diff --quiet --cached && echo 'no change' && exit 0
          git commit -m 'chore(assets): re-render profile cards'
          git push
